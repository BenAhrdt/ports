name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bereits nach GitHub gepushter Tag, z. B. v0.1.1'
        required: true
        type: string
      publish:
        description: 'Nach erfolgreichem Test ein GitHub-Release veröffentlichen'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Release testen und veröffentlichen
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Release-Version prüfen
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Release-Tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$file_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag, VERSION und package.json müssen dieselbe Version enthalten." >&2
            echo "Tag: $tag_version · VERSION: $file_version · package.json: $package_version" >&2
            exit 1
          fi

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Produktions-Build erzeugen
        run: npm run build

      - name: Release Notes aus CHANGELOG.md vorbereiten
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          version="${RELEASE_TAG#v}"

          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture=1 }
            capture && index($0, "## ") == 1 && index($0, "## [" version "]") != 1 { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "CHANGELOG.md enthält keinen Bereich für $version." >&2
            exit 1
          fi

          echo "Verwendete Release Notes:"
          cat "$notes_file"

      - name: GitHub-Release erstellen
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG existiert bereits."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Ports $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
